name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_platforms:
        description: |
          逗号分隔的架构列表。可选值：
            windows-x64, windows-arm64, windows-x86,
            macos, linux-x64, linux-arm64, all
          例子：
            "windows-x64"
            "windows-x64,windows-arm64,macos"
            "all"
        required: true
        default: 'windows-x64'
        type: string
      version:
        description: '版本号（留空则用 pubspec.yaml 的当前值，如 "1.3.3"）'
        required: false
        default: ''
        type: string

# 版本号优先取 workflow_dispatch 的 `version` 输入；空时从 pubspec.yaml 解析。
# 所有 job 里的「Resolve app version」步骤会把结果写进 $GITHUB_ENV，
# 后续步骤用 $APP_VERSION / $env:APP_VERSION 取值。
#
# Windows 安装器由 tool/installer.iss（Inno Setup 6）生成到 installer_output/。
# 打包前先把 VC++ 运行库拷进构建产物（app-local 部署），否则装到没装
# VC++ 可再发行包的机器上会直接启动失败。

jobs:
  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'windows-x64') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Deploy VC++ runtime (app-local)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crt = Get-ChildItem -Path $crtRoot -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
                 Where-Object { $_.FullName -match "\\x64\\" } |
                 Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "未找到 x64 的 VC++ CRT 可再发行目录：$crtRoot" }
          Write-Host "CRT 来源: $($crt.FullName)"
          $dest = "build\windows\x64\runner\Release"
          if (-not (Test-Path $dest)) { throw "未找到构建产物目录：$dest" }
          foreach ($f in @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')) {
            $src = Join-Path $crt.FullName $f
            if (Test-Path $src) { Copy-Item $src $dest -Force; Write-Host "  + $f" }
            else { Write-Host "  - $f 缺失，跳过" }
          }

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DArchLabel=x64" "/DBuildDir=x64" "/DSourceRoot=${{ github.workspace }}" "tool\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          path: installer_output/*.exe
          archive: false
          if-no-files-found: error

  build-windows-arm64:
    name: "Windows arm64"
    runs-on: windows-11-arm
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'windows-arm64') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: x64

      - name: Switch Flutter to native Windows ARM64 Dart SDK
        shell: pwsh
        run: |
          $versionFile = "$env:FLUTTER_ROOT\bin\cache\dart-sdk\version"
          $dartSemver = (Get-Content $versionFile).Trim().Split(" ")[0]
          Write-Host "Downloading native Windows ARM64 Dart SDK for version: $dartSemver"
          $zipPath = "$env:TEMP\dartsdk-windows-arm64.zip"
          Invoke-WebRequest -Uri "https://storage.googleapis.com/dart-archive/channels/stable/release/$dartSemver/sdk/dartsdk-windows-arm64-release.zip" -OutFile $zipPath

          Remove-Item -Recurse -Force "$env:FLUTTER_ROOT\bin\cache\dart-sdk"
          Expand-Archive -Path $zipPath -DestinationPath "$env:FLUTTER_ROOT\bin\cache"
          Remove-Item -Force $zipPath

          Remove-Item -Force "$env:FLUTTER_ROOT\bin\cache\flutter_tools.snapshot" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:FLUTTER_ROOT\bin\cache\flutter_tools.stamp" -ErrorAction SilentlyContinue

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Precache Windows ARM64 engine artifacts
        run: flutter precache --windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows arm64
        run: flutter build windows --release

      - name: Deploy VC++ runtime (app-local)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crt = Get-ChildItem -Path $crtRoot -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
                 Where-Object { $_.FullName -match "\\arm64\\" } |
                 Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "未找到 arm64 的 VC++ CRT 可再发行目录：$crtRoot" }
          Write-Host "CRT 来源: $($crt.FullName)"
          $dest = "build\windows\arm64\runner\Release"
          if (-not (Test-Path $dest)) { throw "未找到构建产物目录：$dest" }
          foreach ($f in @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')) {
            $src = Join-Path $crt.FullName $f
            if (Test-Path $src) { Copy-Item $src $dest -Force; Write-Host "  + $f" }
            else { Write-Host "  - $f 缺失，跳过" }
          }

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DArchLabel=arm64" "/DBuildDir=arm64" "/DSourceRoot=${{ github.workspace }}" "tool\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          path: installer_output/*.exe
          archive: false
          if-no-files-found: error

  build-windows-x86:
    name: "Windows x86"
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'windows-x86') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x86
        shell: pwsh
        run: |
          flutter build windows --release

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $cmakePath = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"

          $buildDir = "build\windows\x64"
          & $cmakePath -G "Visual Studio 17 2022" -A Win32 -S windows -B "$buildDir" -DFLUTTER_TARGET="lib\main.dart"
          & $cmakePath --build "$buildDir" --config Release

      - name: Deploy VC++ runtime (app-local)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $crtRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crt = Get-ChildItem -Path $crtRoot -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
                 Where-Object { $_.FullName -match "\\x86\\" } |
                 Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "未找到 x86 的 VC++ CRT 可再发行目录：$crtRoot" }
          Write-Host "CRT 来源: $($crt.FullName)"
          $dest = "build\windows\x64\runner\Release"
          if (-not (Test-Path $dest)) { throw "未找到构建产物目录：$dest" }
          foreach ($f in @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')) {
            $src = Join-Path $crt.FullName $f
            if (Test-Path $src) { Copy-Item $src $dest -Force; Write-Host "  + $f" }
            else { Write-Host "  - $f 缺失，跳过" }
          }

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DArchLabel=x86" "/DBuildDir=x64" "/DSourceRoot=${{ github.workspace }}" "tool\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          path: installer_output/*.exe
          archive: false
          if-no-files-found: error

  build-macos:
    name: "macOS"
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'macos') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Sign macOS app (ad-hoc)
        run: |
          APP_PATH="build/macos/Build/Products/Release/PCelechron.app"
          codesign --force --deep --sign - "$APP_PATH"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "PCelechron" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "PCelechron.app" 200 190 \
            --hide-extension "PCelechron.app" \
            --app-drop-link 600 190 \
            "pcelechron-${APP_VERSION}-macos.dmg" \
            "build/macos/Build/Products/Release/PCelechron.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: pcelechron-*-macos.dmg
          archive: false
          if-no-files-found: error

  build-linux-x64:
    name: "Linux x64"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'linux-x64') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create DEB package
        run: |
          DEB_DIR="pcelechron_${APP_VERSION}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/pcelechron"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: pcelechron
          Version: $APP_VERSION
          Architecture: amd64
          Maintainer: Flaviohor
          Description: PCelechron - A calendar scheduling assistant (PC port of Celechron)
          EOF

          cp -r build/linux/x64/release/bundle/* "$DEB_DIR/opt/pcelechron/"
          ln -s /opt/pcelechron/pcelechron "$DEB_DIR/usr/bin/pcelechron"

          cp assets/logo.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/pcelechron.png" 2>/dev/null || true

          cat > "$DEB_DIR/usr/share/applications/pcelechron.desktop" << EOF
          [Desktop Entry]
          Name=PCelechron
          Exec=pcelechron
          Icon=pcelechron
          Type=Application
          Categories=Utility;Calendar;
          EOF

          dpkg-deb --build "$DEB_DIR"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          path: pcelechron_*.deb
          archive: false
          if-no-files-found: error

  build-linux-arm64:
    name: "Linux arm64"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target_platforms, 'all') || contains(github.event.inputs.target_platforms, 'linux-arm64') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
            echo "version from workflow input override: $v"
          else
            v=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)
            echo "version from pubspec.yaml: $v"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION=$v"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux arm64 in Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            arm64v8/ubuntu:22.04 \
            bash -c "
              apt-get update && \
              apt-get install -y curl git unzip xz-utils zip ninja-build \
                libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev \
                clang cmake pkg-config \
                liblzma-dev libstdc++-12-dev dpkg-dev && \
              rm -rf /var/lib/apt/lists/* && \
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter && \
              export PATH=/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:\$PATH && \
              flutter precache --linux && \
              flutter config --enable-linux-desktop && \
              flutter pub get && \
              flutter build linux --release && \
              DEB_DIR=pcelechron_${APP_VERSION}_arm64 && \
              mkdir -p \$DEB_DIR/DEBIAN && \
              mkdir -p \$DEB_DIR/opt/pcelechron && \
              mkdir -p \$DEB_DIR/usr/bin && \
              mkdir -p \$DEB_DIR/usr/share/applications && \
              mkdir -p \$DEB_DIR/usr/share/icons/hicolor/256x256/apps && \
              printf 'Package: pcelechron\nVersion: ${APP_VERSION}\nArchitecture: arm64\nMaintainer: Flaviohor\nDescription: PCelechron - A calendar scheduling assistant (PC port of Celechron)\n' > \$DEB_DIR/DEBIAN/control && \
              cp -r build/linux/arm64/release/bundle/* \$DEB_DIR/opt/pcelechron/ && \
              ln -s /opt/pcelechron/pcelechron \$DEB_DIR/usr/bin/pcelechron && \
              cp assets/logo.png \$DEB_DIR/usr/share/icons/hicolor/256x256/apps/pcelechron.png 2>/dev/null || true && \
              printf '[Desktop Entry]\nName=PCelechron\nExec=pcelechron\nIcon=pcelechron\nType=Application\nCategories=Utility;Calendar;\n' > \$DEB_DIR/usr/share/applications/pcelechron.desktop && \
              dpkg-deb --build \$DEB_DIR
            "

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          path: pcelechron_*.deb
          archive: false
          if-no-files-found: error